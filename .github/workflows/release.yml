name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.0.17"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test-build-release:
    name: Test, package, and publish
    runs-on: windows-latest
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CERTIFICATE_PATH: ${{ runner.temp }}\WinToastRelay-signing.pfx
      CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
      APP_PACKAGES_PATH: ${{ github.workspace }}\AppPackages
      RELEASE_PATH: ${{ github.workspace }}\release

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Validate release tag and synchronize package version
        shell: pwsh
        run: |
          $match = [regex]::Match($env:RELEASE_TAG, '^v(?<version>\d+\.\d+\.\d+)(?:\.0)?$')
          if (-not $match.Success) {
            throw "Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.17."
          }

          $version = $match.Groups['version'].Value
          $packageVersion = "$version.0"
          $projectPath = 'WinToastRelay.csproj'
          $manifestPath = 'Package.appxmanifest'

          (Get-Content $projectPath -Raw) -replace '<VersionPrefix>[^<]+</VersionPrefix>', "<VersionPrefix>$version</VersionPrefix>" |
            Set-Content $projectPath -NoNewline
          (Get-Content $manifestPath -Raw) -replace 'Version="\d+\.\d+\.\d+\.\d+" />', "Version=`"$packageVersion`" />" |
            Set-Content $manifestPath -NoNewline

      - name: Materialize signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            throw 'Missing MSIX_CERTIFICATE_BASE64 repository or environment secret.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) {
            throw 'Missing MSIX_CERTIFICATE_PASSWORD repository or environment secret.'
          }

          [IO.File]::WriteAllBytes($env:CERTIFICATE_PATH, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:CERTIFICATE_PATH,
            $env:CERTIFICATE_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          if ($certificate.Subject -ne 'CN=RavelloH') {
            throw "The signing certificate subject must be CN=RavelloH; received $($certificate.Subject)."
          }
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'WinToastRelay.cer'), $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore WinToastRelay.csproj -r win-x64
          dotnet restore tests/WinToastRelay.Tests/WinToastRelay.Tests.csproj

      - name: Test
        run: dotnet test tests/WinToastRelay.Tests/WinToastRelay.Tests.csproj -c Release --no-restore

      - name: Build signed MSIX bundle
        shell: pwsh
        run: |
          dotnet publish WinToastRelay.csproj -r win-x64 -p:Platform=x64 -p:Configuration=Release `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms=x64 `
            -p:PackageCertificateKeyFile="$env:CERTIFICATE_PATH" `
            -p:PackageCertificatePassword="$env:CERTIFICATE_PASSWORD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:RELEASE_PATH | Out-Null
          $bundle = Get-ChildItem $env:APP_PACKAGES_PATH -Recurse -Filter '*.msixbundle' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $bundle) { throw 'No MSIX bundle was produced.' }
          Copy-Item $bundle.FullName (Join-Path $env:RELEASE_PATH "WinToastRelay-$env:RELEASE_TAG-x64.msixbundle")
          Copy-Item (Join-Path $env:RUNNER_TEMP 'WinToastRelay.cer') (Join-Path $env:RELEASE_PATH 'WinToastRelay.cer')
          Get-ChildItem $env:RELEASE_PATH -File | Select-Object Name, Length

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinToastRelay-${{ env.RELEASE_TAG }}-x64
          path: release/*
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release/*

      - name: Remove signing material
        if: always()
        shell: pwsh
        run: Remove-Item $env:CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
